<style>
  :root {
    --bg: #f5f5f7;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --key-bg: #ffffff;
    --key-text: #000000;
    --key-shadow: 0 1px 3px rgba(16,24,40,0.10);
    --accent: #0071e3;
    --accent-hover: #0060c8;
    --container-bg: #ffffff;
    --container-shadow: 0 8px 24px rgba(16,24,40,0.06);
    --btn-border: rgba(0,0,0,0.12);
    --badge-idle-bg: #d1d1d6;
    --badge-idle-text: #3a3a3c;
    --badge-hit-bg: #248a3d;
    --badge-hit-text: #ffffff;
    --flag-manual: #ff3b30;
    --flag-chatter: #ff9500;

    /* 按鍵單位：依視窗寬度縮放，最大 56px */
    --u: clamp(30px, calc((100vw - 48px) / 17.8), 56px);
    --gap: calc(var(--u) * 0.14);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1c1e;
      --text: #f5f5f7;
      --muted: #9b9b9f;
      --key-bg: #2c2c2e;
      --key-text: #f5f5f7;
      --key-shadow: 0 1px 6px rgba(0,0,0,0.6);
      --container-bg: #000000;
      --container-shadow: 0 20px 50px rgba(0,0,0,0.6);
      --btn-border: rgba(255,255,255,0.14);
      --badge-idle-bg: #48484a;
      --badge-idle-text: #e5e5ea;
      --badge-hit-bg: #30d158;
      --badge-hit-text: #000000;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1e;
    --text: #f5f5f7;
    --muted: #9b9b9f;
    --key-bg: #2c2c2e;
    --key-text: #f5f5f7;
    --key-shadow: 0 1px 6px rgba(0,0,0,0.6);
    --container-bg: #000000;
    --container-shadow: 0 20px 50px rgba(0,0,0,0.6);
    --btn-border: rgba(255,255,255,0.14);
    --badge-idle-bg: #48484a;
    --badge-idle-text: #e5e5ea;
    --badge-hit-bg: #30d158;
    --badge-hit-text: #000000;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
    min-height: 100vh;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 100%;
  }

  h1 {
    font-size: clamp(24px, 5vw, 32px);
    font-weight: 700;
    margin: 0 0 8px;
    text-align: center;
  }
  .desc {
    font-size: 16px;
    line-height: 1.5;
    color: var(--muted);
    margin: 0 0 24px;
    text-align: center;
    max-width: 640px;
  }

  .toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .btn {
    border-radius: 12px;
    padding: 10px 20px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
  }
  .btn:active { transform: scale(0.98); }

  #resetBtn {
    background: var(--accent);
    color: #fff;
    border: none;
    box-shadow: 0 4px 12px rgba(0,113,227,0.3);
  }
  #resetBtn:hover { background: var(--accent-hover); }

  #themeToggleBtn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--btn-border);
  }

  .layout-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }
  #layoutSelect {
    border: 1px solid var(--btn-border);
    border-radius: 10px;
    padding: 9px 12px;
    font: inherit;
    font-size: 16px;
    background: var(--container-bg);
    color: var(--text);
  }

  .progress {
    margin: 0 0 20px;
    font-size: 15px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .progress strong { color: var(--text); }

  .keyboard-container {
    background: var(--container-bg);
    padding: calc(var(--u) * 0.36);
    border-radius: calc(var(--u) * 0.43);
    box-shadow: var(--container-shadow);
    max-width: 100%;
    overflow-x: auto;
  }
  #keyboard { width: max-content; }

  .row {
    display: flex;
    gap: var(--gap);
    margin-bottom: var(--gap);
  }
  .row:last-child { margin-bottom: 0; }

  /* --w 為按鍵寬度（單位數），寬鍵會把中間省略的間距補回來，讓每列對齊 */
  .key {
    --w: 1;
    position: relative;
    flex: none;
    width: calc(var(--u) * var(--w) + var(--gap) * (var(--w) - 1));
    height: var(--u);
    background: var(--key-bg);
    color: var(--key-text);
    border-radius: calc(var(--u) * 0.21);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(9px, calc(var(--u) * 0.26), 15px);
    font-weight: 500;
    box-shadow: var(--key-shadow);
    transition: transform 0.08s ease, background-color 0.08s ease, color 0.08s ease;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
    white-space: nowrap;
  }
  .key.pressed {
    transform: translateY(2px);
    background: var(--accent);
    color: #fff;
  }
  .key.na {
    opacity: 0.4;
    cursor: help;
  }

  /* 方向鍵上下兩個半高鍵 */
  .key-stack {
    flex: none;
    width: var(--u);
    height: var(--u);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .key.half {
    width: 100%;
    height: calc((var(--u) - 2px) / 2);
    font-size: clamp(8px, calc(var(--u) * 0.2), 12px);
  }

  /* 計數徽章（右上角） */
  .badge {
    position: absolute;
    top: calc(var(--u) * -0.15);
    right: calc(var(--u) * -0.15);
    min-width: calc(var(--u) * 0.42);
    height: calc(var(--u) * 0.42);
    padding: 0 4px;
    border-radius: 999px;
    background: var(--badge-idle-bg);
    color: var(--badge-idle-text);
    font-size: clamp(9px, calc(var(--u) * 0.22), 13px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    pointer-events: none;
    z-index: 1;
  }
  .badge.hit {
    background: var(--badge-hit-bg);
    color: var(--badge-hit-text);
  }
  .key.half .badge {
    min-width: calc(var(--u) * 0.34);
    height: calc(var(--u) * 0.34);
    top: calc(var(--u) * -0.12);
    right: calc(var(--u) * -0.12);
  }
  .key.half .warning {
    top: 50%;
    width: calc(var(--u) * 0.3);
    height: calc(var(--u) * 0.3);
    margin-top: calc(var(--u) * -0.15);
  }
  .key.half.lower .badge {
    top: auto;
    bottom: calc(var(--u) * -0.12);
  }

  /* 故障標記（左上角） */
  /* 放在按鍵內側，避免和左邊按鍵的計數徽章重疊 */
  .warning {
    position: absolute;
    top: calc(var(--u) * 0.06);
    left: calc(var(--u) * 0.06);
    width: calc(var(--u) * 0.34);
    height: calc(var(--u) * 0.34);
    color: #fff;
    border-radius: 50%;
    font-size: clamp(9px, calc(var(--u) * 0.24), 14px);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    animation: pop 0.3s ease;
    pointer-events: none;
    z-index: 2;
  }
  .warning.manual  { background: var(--flag-manual); }
  .warning.chatter { background: var(--flag-chatter); }

  @keyframes pop {
    0% { transform: scale(0); }
    80% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 20px;
    margin: 20px 0 0;
    padding: 0;
    list-style: none;
    font-size: 14px;
    color: var(--muted);
  }
  .legend li { display: flex; align-items: center; gap: 6px; }
  .dot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
  }
  .dot.idle    { background: var(--badge-idle-bg); }
  .dot.hit     { background: var(--badge-hit-bg); }
  .dot.chatter { background: var(--flag-chatter); }
  .dot.manual  { background: var(--flag-manual); }

  @media (max-width: 480px) {
    body { padding: 24px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .key, .btn, .warning { transition: none; animation: none; }
  }
</style>
</head>
<body>

<main>
  <h1>鍵盤按鍵診斷工具</h1>
  <p class="desc">按下實體鍵盤上的每個按鍵即可計數；同一顆鍵在極短時間內重複觸發（連點）會自動標示。點擊畫面上的按鍵可手動標記故障。Mac 的 F1–F12 可能需要同時按住 fn。</p>

  <div class="toolbar">
    <button id="resetBtn" class="btn" type="button">重設所有計數與標記</button>
    <button id="themeToggleBtn" class="btn" type="button" aria-label="切換主題（系統 → 深色 → 亮色）">主題：系統</button>
    <label class="layout-label" for="layoutSelect">
      佈局
      <select id="layoutSelect">
        <option value="mac">Mac (ANSI)</option>
        <option value="win">Windows (ANSI)</option>
      </select>
    </label>
  </div>

  <p class="progress" id="progress"></p>

  <section class="keyboard-container" aria-label="鍵盤按鍵診斷區域">
    <div id="keyboard"></div>
  </section>

  <ul class="legend">
    <li><span class="dot idle"></span>未測試</li>
    <li><span class="dot hit"></span>已測試（數字為次數）</li>
    <li><span class="dot chatter">!</span>疑似連點</li>
    <li><span class="dot manual">!</span>手動標記故障</li>
  </ul>
</main>

<script>
// 同一顆鍵兩次按下的間隔小於此值（毫秒）視為連點
const CHATTER_MS = 80;

// ---------- 版型資料 ----------
// 每顆鍵：{ code: KeyboardEvent.code, label, w: 寬度單位 }；na = 瀏覽器無法偵測
const k = (code, label, w) => ({ code, label, w });
const letters = s => [...s].map(c => k('Key' + c, c));

function buildLayout(name) {
  const mac = name === 'mac';
  const fKeys = Array.from({ length: 12 }, (_, i) => k('F' + (i + 1), 'F' + (i + 1), 1.125));
  const arrows = [
    k('ArrowLeft', '←'),
    { stack: [k('ArrowUp', '↑'), k('ArrowDown', '↓')] },
    k('ArrowRight', '→'),
  ];
  const bottom = mac
    ? [
        { label: 'fn', w: 1, na: true },
        k('ControlLeft', 'control'),
        k('AltLeft', 'option'),
        k('MetaLeft', 'command', 1.25),
        k('Space', '', 5.5),
        k('MetaRight', 'command', 1.25),
        k('AltRight', 'option'),
        ...arrows,
      ]
    : [
        k('ControlLeft', 'Ctrl', 1.25),
        k('MetaLeft', 'Win', 1.25),
        k('AltLeft', 'Alt', 1.25),
        k('Space', '', 5.25),
        k('AltRight', 'Alt'),
        k('ContextMenu', 'Menu'),
        k('ControlRight', 'Ctrl'),
        ...arrows,
      ];

  return [
    [k('Escape', mac ? 'esc' : 'Esc', 1.5), ...fKeys],
    [
      k('Backquote', '`'),
      ...'1234567890'.split('').map(d => k('Digit' + d, d)),
      k('Minus', '-'),
      k('Equal', '='),
      k('Backspace', mac ? 'delete' : 'Backspace', 2),
    ],
    [
      k('Tab', mac ? 'tab' : 'Tab', 1.5),
      ...letters('QWERTYUIOP'),
      k('BracketLeft', '['),
      k('BracketRight', ']'),
      k('Backslash', '\\', 1.5),
    ],
    [
      k('CapsLock', mac ? 'caps lock' : 'Caps Lock', 1.75),
      ...letters('ASDFGHJKL'),
      k('Semicolon', ';'),
      k('Quote', "'"),
      k('Enter', mac ? 'return' : 'Enter', 2.25),
    ],
    [
      k('ShiftLeft', mac ? 'shift' : 'Shift', 2.25),
      ...letters('ZXCVBNM'),
      k('Comma', ','),
      k('Period', '.'),
      k('Slash', '/'),
      k('ShiftRight', mac ? 'shift' : 'Shift', 2.75),
    ],
    bottom,
  ];
}

// ---------- 狀態 ----------
const keyEls = new Map();   // code → 按鍵元素
const counts = new Map();   // code → 次數
const lastDown = new Map(); // code → 上次按下時間
const down = new Map();     // code → 按下時的 CapsLock 狀態（目前按住中的鍵）
const manual = new Set();   // 手動標記
const chatter = new Map();  // code → 連點間隔 ms

const keyboardEl = document.getElementById('keyboard');
const layoutSelect = document.getElementById('layoutSelect');
const progressEl = document.getElementById('progress');
const MODIFIERS = /^(Shift|Control|Alt|Meta)(Left|Right)$|^CapsLock$/;

const store = {
  get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
  set(key, v) { try { localStorage.setItem(key, v); } catch (e) {} },
  remove(key) { try { localStorage.removeItem(key); } catch (e) {} },
};

// ---------- 渲染 ----------
function makeKey(def, extraClass) {
  const el = document.createElement('div');
  el.className = extraClass ? 'key ' + extraClass : 'key';
  if (def.w && def.w !== 1) el.style.setProperty('--w', def.w);
  el.textContent = def.label;

  if (def.na) {
    el.classList.add('na');
    el.title = '瀏覽器無法偵測此鍵';
    return el;
  }

  el.dataset.code = def.code;
  if (!def.label) el.setAttribute('aria-label', def.code);
  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = '0';
  el.appendChild(badge);
  el.addEventListener('click', () => toggleFlag(def.code));
  keyEls.set(def.code, el);
  return el;
}

function renderKeyboard(name) {
  keyEls.clear();
  keyboardEl.replaceChildren();
  for (const row of buildLayout(name)) {
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    for (const def of row) {
      if (def.stack) {
        const stack = document.createElement('div');
        stack.className = 'key-stack';
        def.stack.forEach((sub, i) => stack.appendChild(makeKey(sub, i ? 'half lower' : 'half')));
        rowEl.appendChild(stack);
      } else {
        rowEl.appendChild(makeKey(def));
      }
    }
    keyboardEl.appendChild(rowEl);
  }
}

function renderFlag(code) {
  const el = keyEls.get(code);
  if (!el) return;
  el.querySelector('.warning')?.remove();
  let cls = null, title = '';
  if (manual.has(code)) { cls = 'manual'; title = '手動標記故障'; }
  else if (chatter.has(code)) { cls = 'chatter'; title = `疑似連點：${chatter.get(code)} ms`; }
  if (!cls) { el.removeAttribute('title'); return; }
  const warn = document.createElement('span');
  warn.className = 'warning ' + cls;
  warn.textContent = '!';
  el.title = title;
  el.appendChild(warn);
}

function updateProgress() {
  let tested = 0;
  for (const code of keyEls.keys()) if (counts.get(code) > 0) tested++;
  const faulty = new Set([...manual, ...chatter.keys()]).size;
  progressEl.innerHTML =
    `已測試 <strong>${tested}</strong> / ${keyEls.size} 鍵 · 疑似故障 <strong>${faulty}</strong> 鍵`;
}

// ---------- 動作 ----------
function bump(code) {
  const n = (counts.get(code) || 0) + 1;
  counts.set(code, n);
  const badge = keyEls.get(code).querySelector('.badge');
  badge.textContent = n;
  badge.classList.add('hit');
  updateProgress();
}

function toggleFlag(code) {
  if (manual.has(code) || chatter.has(code)) {
    manual.delete(code);
    chatter.delete(code);
  } else {
    manual.add(code);
  }
  renderFlag(code);
  updateProgress();
}

// 只清除畫面上的按下效果；down 記錄保留，避免之後補到的 keyup 被重複計數
function clearPressed(onlyNonModifiers) {
  for (const [code, el] of keyEls) {
    if (onlyNonModifiers && MODIFIERS.test(code)) continue;
    el.classList.remove('pressed');
  }
}

function resetAll() {
  counts.clear();
  lastDown.clear();
  down.clear();
  manual.clear();
  chatter.clear();
  for (const el of keyEls.values()) {
    const badge = el.querySelector('.badge');
    badge.textContent = '0';
    badge.classList.remove('hit');
    el.classList.remove('pressed');
    el.querySelector('.warning')?.remove();
    el.removeAttribute('title');
  }
  updateProgress();
}

// ---------- 實體鍵盤 ----------
document.addEventListener('keydown', e => {
  if (e.target instanceof HTMLSelectElement) return; // 讓佈局選單可用鍵盤操作
  e.preventDefault();
  if (e.repeat) return; // 長按自動重複不計
  const code = e.code;
  const el = keyEls.get(code);
  if (!el) return;

  const now = e.timeStamp;
  const prev = lastDown.get(code);
  lastDown.set(code, now);
  down.set(code, e.getModifierState('CapsLock'));
  el.classList.add('pressed');
  bump(code);

  if (prev !== undefined && now - prev < CHATTER_MS) {
    chatter.set(code, Math.round(now - prev));
    renderFlag(code);
    updateProgress();
  }
});

document.addEventListener('keyup', e => {
  if (e.target instanceof HTMLSelectElement) return;
  const code = e.code;
  const el = keyEls.get(code);
  if (!el) return;
  e.preventDefault();
  el.classList.remove('pressed');

  // 只收到 keyup 的按鍵也要計數：
  // 例如 macOS 的 Caps Lock 關閉時只送 keyup，或 Windows 的 PrintScreen
  const capsAtDown = down.get(code);
  const missedDown = !down.has(code) ||
    (code === 'CapsLock' && capsAtDown !== e.getModifierState('CapsLock'));
  down.delete(code);
  if (missedDown) {
    lastDown.set(code, e.timeStamp);
    bump(code);
  }

  // Mac 按住 ⌘ 時其他鍵收不到 keyup，放開 ⌘ 時一併清除
  if (code === 'MetaLeft' || code === 'MetaRight') clearPressed(true);
});

window.addEventListener('blur', () => clearPressed(false));

// ---------- 工具列 ----------
document.getElementById('resetBtn').addEventListener('click', e => {
  resetAll();
  e.currentTarget.blur(); // 避免之後按 Space/Enter 觸發按鈕
});

function detectLayout() {
  const p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  return /mac|iphone|ipad/i.test(p) ? 'mac' : 'win';
}

layoutSelect.addEventListener('change', () => {
  store.set('layout', layoutSelect.value);
  renderKeyboard(layoutSelect.value);
  resetAll();
  layoutSelect.blur();
});

const savedLayout = store.get('layout');
layoutSelect.value = savedLayout === 'mac' || savedLayout === 'win' ? savedLayout : detectLayout();
renderKeyboard(layoutSelect.value);
resetAll();

// 主題：系統 → 深色 → 亮色 → 系統
(function () {
  const btn = document.getElementById('themeToggleBtn');
  const root = document.documentElement;
  const labels = { system: '主題：系統', dark: '主題：深色', light: '主題：亮色' };
  const next = { system: 'dark', dark: 'light', light: 'system' };

  function apply(choice) {
    if (choice === 'system') {
      root.removeAttribute('data-theme');
      store.remove('theme');
    } else {
      root.setAttribute('data-theme', choice);
      store.set('theme', choice);
    }
    btn.textContent = labels[choice];
  }

  let current = root.getAttribute('data-theme') || 'system';
  btn.textContent = labels[current];
  btn.addEventListener('click', () => {
    current = next[current];
    apply(current);
    btn.blur();
  });
})();
</script>
